{% extends "site/base.html" %}
{% block title %}Definir nova senha{% endblock %}
{% block content %}<section class="container" style="max-width:620px;padding:4rem 1rem"><h1>Definir nova senha</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit" class="btn btn-primary">Salvar nova senha</button></form>{% else %}<p>Este link é inválido ou expirou. Solicite uma nova redefinição.</p><a href="{% url 'password_reset' %}">Solicitar novo link</a>{% endif %}</section>{% endblock %}
