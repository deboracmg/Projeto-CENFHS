<dialog class="familia-modal" id="familiaModal">
    <div class="modal-header">
        <div>
            <h2 id="tituloModalFamiliar">Adicionar familiar</h2>
            <p id="subtituloModalFamiliar">Preencha os dados abaixo</p>
        </div>

        <button type="button" class="modal-close" id="btnFecharFamiliar">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <div class="modal-body">
        <form id="formFamiliar">
            {% csrf_token %}
            <input type="hidden" id="id_aluno_referencia" name="id_aluno_referencia" value=""/>

            <input type="hidden" id="parente_id" name="parente_id" value=""/>

            <div class="campos-familiar">
                <!-- CPF + Buscar -->
                <div class="form-group">
                    <label for="cpf_familiar">CPF</label>

                    <div class="cpf-box">
                        <input type="text" id="cpf_familiar" name="cpf_familiar" disabled/>

                        <button
                            type="button"
                            class="btn-buscar-parente"
                            id="btnBuscarParente"
                            title="Buscar CPF"
                        >
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                    </div>
                </div>

                <!-- Nome -->
                <div class="form-group">
                    <label for="nome_familiar">Nome completo</label>

                    <input type="text" id="nome_familiar" name="nome_familiar" disabled/>
                </div>

                <!-- Telefone -->
                <div class="form-group">
                    <label for="telefone_familiar">Telefone</label>

                    <input type="text" id="telefone_familiar" name="telefone_familiar" disabled/>
                </div>

                <!-- Profissão -->
                <div class="form-group">
                    <label for="profissao_familiar">Profissão</label>

                    <input
                        type="text"
                        id="profissao_familiar"
                        name="profissao_familiar"
                        disabled
                    />
                </div>

                <!-- Local de trabalho -->
                <div class="form-group">
                    <label for="local_trabalho_familiar">
                        Local de trabalho
                    </label>

                    <input
                        type="text"
                        id="local_trabalho_familiar"
                        name="local_trabalho_familiar"
                        disabled
                    />
                </div>

                <!-- Escolaridade -->
                <div class="form-group">
                    <label for="escolaridade_familiar"> Escolaridade </label>

                    <select id="escolaridade_familiar" name="escolaridade_familiar" disabled>
                        <option value="" selected disabled>Selecione</option>
                        
                        {% for valor, rotulo in escolaridade %}
                            <option value="{{ valor }}">
                                {{ rotulo }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="parentesco_familiar"> Parentesco </label>

                    <input
                        type="text"
                        id="parentesco_familiar"
                        name="parentesco_familiar"
                        disabled
                    />
                </div>
            </div>

            <!-- Parentesco -->
            <div class="vinculo-familiar">
                <input type="hidden" id="parentesco_id" name="parentesco_id" />

                <div class="checkbox-group">
                    <input
                        checked
                        type="checkbox"
                        id="familiar_vivo"
                        name="familiar_vivo"
                        disabled
                    />
                    <label for="familiar_vivo">Vivo?</label>
                </div>

                <div class="checkbox-group">
                    <input
                        type="checkbox"
                        id="familiar_responsavel"
                        name="familiar_responsavel"
                        disabled
                    />
                    <label for="familiar_responsavel">
                        Responsável legal?
                    </label>
                </div>

                <div class="checkbox-group">
                    <input
                        type="checkbox"
                        id="familiar_emergencia"
                        name="familiar_emergencia"
                        disabled
                    />
                    <label for="familiar_emergencia">
                        Contato de emergência?
                    </label>
                </div>
            </div>
        </form>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn-edit" id="btnEditarFamiliar">
            <i class="fa-solid fa-pen"></i>
            Editar
        </button>

        <button
            type="submit"
            form="formFamiliar"
            class="btn-save"
            id="btnSalvarFamiliar"
        >
            <i class="fa-solid fa-floppy-disk"></i>
            Salvar
        </button>
    </div>
</dialog>
