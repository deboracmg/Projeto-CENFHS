<dialog id="modalTratamento" class="small-modal">
    <div class="modal-header">
        <div>
            <h2 id="tituloModalTratamento">Adicionar tratamento</h2>
            <p id="subtituloModalTratamento">Preencha os dados abaixo</p>
        </div>

        <button type="button" class="modal-close" id="btnFecharTratamento">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <div class="modal-body">
        <form id="formTratamento" novalidate>
            {% csrf_token %}
            <input
                type="hidden"
                id="tratamento_id"
                name="tratamento_id"
                value=""
            />

            <div class="form-grid">
                <!-- Data de entrada -->
                <div class="form-group">
                    <label for="data_entrada"> Data de entrada </label>

                    <input
                        type="date"
                        id="data_entrada"
                        name="data_entrada"
                        disabled
                        required
                    />
                </div>

                <!-- Data de saída -->
                <div class="form-group">
                    <label for="data_saida"> Data de saída </label>

                    <input
                        type="date"
                        id="data_saida"
                        name="data_saida"
                        disabled
                    />
                </div>

                <!-- Tipo de paciente -->
                <div class="form-group">
                    <label for="tipo_paciente">Tipo de paciente</label>
                    <input
                        type="text"
                        id="tipo_paciente"
                        name="tipo_paciente"
                        placeholder="Tipo de paciente"
                        maxlength="50"
                        disabled
                    />
                </div>

                <div class="form-group">
                    <label for="tratamento">Tratamento</label>
                    <input
                        type="text"
                        id="tratamento"
                        name="tratamento"
                        placeholder="Digite o tratamento"
                        maxlength="150"
                        disabled
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="n_sessoes">Número de sessões</label>

                    <input
                        type="text"
                        id="n_sessoes"
                        name="n_sessoes"
                        placeholder="Ex.: 4"
                        maxlength="3"
                        disabled
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="observacoes">Observações</label>

                    <textarea
                        id="observacoes"
                        name="observacoes"
                        placeholder="Digite observações sobre o paciente"
                        disabled
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="acompanhante">Acompanhante</label>
                    <input
                        type="text"
                        id="acompanhante"
                        name="acompanhante"
                        placeholder="Nome do acompanhante"
                        maxlength="150"
                        disabled
                    />
                </div>

                <!-- Telefone -->
                <div class="form-group">
                    <label for="telefone_acompanhante"
                        >Telefone do acompanhante</label
                    >

                    <input
                        type="text"
                        id="telefone_acompanhante"
                        name="telefone_acompanhante"
                        maxlength="15"
                        placeholder="(00) 00000-0000"
                        disabled
                    />
                </div>

                <div class="form-group">
                    <label for="registrado_por">Registrado por</label>
                    <input
                        type="text"
                        id="registrado_por"
                        name="registrado_por"
                        placeholder="Nome do voluntário"
                        maxlength="50"
                        disabled
                        required
                    />
                </div>
            </div>
        </form>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn-finalizar" id="btnFinalizarTratamento">
            <i class="fa-regular fa-trash-can"></i>
            Finalizar Tratamento
        </button>

        <button type="button" class="btn-edit" id="btnEditarTratamento">
            <i class="fa-solid fa-pen"></i>
            Editar
        </button>

        <button
            type="submit"
            form="formTratamento"
            class="btn-save"
            id="btnSalvarTratamento"
        >
            <i class="fa-solid fa-floppy-disk"></i>
            Salvar
        </button>
    </div>
</dialog>
