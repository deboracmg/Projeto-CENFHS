<dialog id="pacienteModal" class="large-modal">
    <!-- HEADER -->
    <div class="modal-header">
        <div>
            <h2 id="tituloModal">Cadastrar novo paciente</h2>
            <p id="subtituloModal">Preencha os dados abaixo</p>
        </div>

        <button type="button" class="modal-close" id="btnFechar">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <!-- ABAS -->
    <div class="modal-tabs">
        <button
            type="button"
            class="tab-button active"
            data-tab="dados-pessoais"
        >
            Dados pessoais
        </button>

        <button type="button" class="tab-button" data-tab="tratamentos">
            Tratamentos
        </button>
    </div>

    <!-- CONTEÚDO -->
    <div class="modal-body">
        <form id="formPaciente" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            <!-- DADOS PESSOAIS -->
            <section class="tab-content active" id="dados-pessoais">
                <div class="form-section">
                    <h3>Dados pessoais</h3>

                    <div class="form-grid">
                        <input
                            type="hidden"
                            id="paciente_id"
                            name="paciente_id"
                            value=""
                        />

                        <div class="form-group">
                            <label for="cpf">CPF</label>

                            <input
                                type="text"
                                id="cpf"
                                name="cpf"
                                placeholder="000.000.000-00"
                                maxlength="14"
                                disabled
                                required
                            />
                        </div>

                        <div class="form-group form-group-large">
                            <label for="nome">Nome completo</label>

                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Digite o nome completo"
                                maxlength="150"
                                disabled
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label for="rg">RG</label>

                            <input
                                type="text"
                                id="rg"
                                name="rg"
                                placeholder="Número da identidade"
                                maxlength="50"
                                disabled
                            />
                        </div>

                        <div class="form-group">
                            <label for="data_nascimento">
                                Data de nascimento
                            </label>

                            <input
                                type="date"
                                id="data_nascimento"
                                name="data_nascimento"
                                disabled
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label for="naturalidade">Naturalidade</label>

                            <input
                                type="text"
                                id="naturalidade"
                                name="naturalidade"
                                placeholder="Cidade de nascimento"
                                maxlength="100"
                                disabled
                            />
                        </div>

                        <div class="form-group">
                            <label for="genero">Gênero</label>

                            <select id="genero" name="genero" disabled required>
                                <option value="" selected disabled>
                                    Selecione
                                </option>

                                {% for valor, rotulo in generos %}
                                <option value="{{ valor }}">
                                    {{ rotulo }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="telefone">Telefone</label>

                            <input
                                type="text"
                                id="telefone"
                                name="telefone"
                                maxlength="15"
                                placeholder="(00) 00000-0000"
                                disabled
                            />
                        </div>

                        <div class="form-group">
                            <label for="email">E-mail</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="exemplo@email.com"
                                maxlength="100"
                                disabled
                            />
                        </div>

                        <div class="form-group">
                            <label for="profissao">Profissão</label>

                            <input
                                type="text"
                                id="profissao"
                                name="profissao"
                                placeholder="Digite a profissão"
                                maxlength="100"
                                disabled
                            />
                        </div>

                        <div class="form-group">
                            <label for="nome_mae">Nome da mãe</label>

                            <input
                                type="text"
                                id="nome_mae"
                                name="nome_mae"
                                placeholder="Nome da mãe"
                                maxlength="150"
                                disabled
                            />
                        </div>

                        <div class="form-group">
                            <label for="nome_pai">Nome do pai</label>

                            <input
                                type="text"
                                id="nome_pai"
                                name="nome_pai"
                                placeholder="Nome do pai"
                                maxlength="150"
                                disabled
                            />
                        </div>
                    </div>
                </div>

                <!-- ENDEREÇO -->
                <div class="form-section">
                    <h3>Endereço</h3>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="cep">CEP</label>

                            <input
                                type="text"
                                id="cep"
                                name="cep"
                                placeholder="00000-000"
                                maxlength="9"
                                disabled
                                required
                            />
                        </div>

                        <div class="form-group form-group-large">
                            <label for="rua">Rua</label>

                            <input
                                type="text"
                                id="rua"
                                name="rua"
                                placeholder="Nome da rua"
                                maxlength="150"
                                disabled
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label for="numero">Número</label>

                            <input
                                type="text"
                                id="numero"
                                name="numero"
                                placeholder="Número"
                                maxlength="10"
                                disabled
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label for="bairro">Bairro</label>

                            <input
                                type="text"
                                id="bairro"
                                name="bairro"
                                placeholder="Bairro"
                                maxlength="100"
                                disabled
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label for="cidade">Cidade</label>

                            <input
                                type="text"
                                id="cidade"
                                name="cidade"
                                placeholder="Cidade"
                                maxlength="100"
                                disabled
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label for="uf">UF</label>

                            <input
                                type="text"
                                id="uf"
                                name="uf"
                                placeholder="UF"
                                maxlength="2"
                                disabled
                                required
                            />
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label
                        >Data de cadastro:
                        <span id="data_cadastro"></span>
                    </label>
                </div>
            </section>

            <!-- TRATAMENTOS -->
            <section class="tab-content" id="tratamentos">
                <div class="tab-top">
                    <div>
                        <h3>Tratamentos</h3>
                        <p>Tratamentos vinculados ao paciente.</p>
                    </div>

                    <button
                        type="button"
                        class="btn-add-tratamento"
                        id="btnAdicionarTratamento"
                        disabled
                    >
                        <i class="fa-solid fa-plus"></i>
                        Adicionar tratamento
                    </button>
                </div>

                <div class="modal-table">
                    <table>
                        <thead>
                            <tr>
                                <th class="left-content">Data Entrada</th>
                                <th class="left-content">Data Saída</th>
                                <th class="left-content">Tratamento</th>
                                <th class="left-content">Nº Sessões</th>
                                <th></th>
                            </tr>
                        </thead>

                        <tbody id="tratamentoBody"></tbody>
                    </table>
                </div>
            </section>
        </form>
    </div>

    <!-- FOOTER / AÇÕES -->
    <div class="modal-footer">
        <button type="button" class="btn-edit" id="btnEditar">
            <i class="fa-solid fa-pen"></i>
            Editar
        </button>

        <button
            type="submit"
            form="formPaciente"
            class="btn-save"
            id="btnSalvar"
        >
            <i class="fa-solid fa-floppy-disk"></i>
            Salvar
        </button>
    </div>
</dialog>
