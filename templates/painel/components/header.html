{% load static %}

<header class="top-header">
    <div class="header-left">
        <a href="{% url 'index' %}" class="header-link" target="_blank">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
            <span>Ver Site</span>
        </a>
    </div>

    <div class="header-right">
        <!-- Usuário -->
        <div class="user-menu">
            <button class="user-button" type="button">
                <i class="fa-solid fa-circle-user user-icon" aria-hidden="true"></i>
                <span class="user-greeting" id="saudacaoUsuario">
                    Olá, {{ request.user.first_name.split.0|default:request.user.username }}!
                </span>
                <i class="fa-solid fa-chevron-down user-arrow" aria-hidden="true"></i>
            </button>

            <!-- Menu suspenso -->
            <div class="user-dropdown">
                <button type="button" class="dropdown-item" id="btnAbrirPerfil">
                    <i class="fa-solid fa-user"></i>
                    Meu perfil
                </button>

                <form method="post" action="{% url 'logout' %}" class="dropdown-logout-form">
                    {% csrf_token %}
                    <button type="submit" class="dropdown-logout">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Sair
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>
