<dialog id="modalAula" class="medium-modal">
    <div class="modal-header">
        <div>
            <h2 id="tituloModal">Adicionar aula</h2>
            <p id="subtituloModal">Preencha os dados e registre a frequência</p>
        </div>

        <button type="button" class="modal-close" id="btnFechar">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <div class="modal-body">
        <form id="formAula" novalidate>
            {% csrf_token %}

            <input type="hidden" id="aula_id" name="aula_id" value="" />

            <!-- Dados da aula -->
            <section>
                <div class="form-section">
                    <div class="form-grid-duplo">
                        <div class="form-group">
                            <label for="data_aula" class="obrigatorio">
                                Data da aula
                            </label>

                            <input
                                type="date"
                                id="data_aula"
                                name="data"
                                required
                            />
                        </div>
                        <div class="form-group">
                            <label for="nome_turma">Turma</label>

                            <input
                                type="text"
                                id="nome_turma"
                                name="nome_turma"
                                disabled
                                readonly
                            />
                        </div>
                    </div>
                </div>
            </section>

            <!-- Frequência -->
            <section>
                <div class="form-section">
                    <h3>Frequência dos alunos</h3>

                    <div class="modal-table">
                        <table>
                            <thead>
                                <tr>
                                    <th class="left-content">Aluno</th>
                                    <th class="left-content">Presença</th>
                                </tr>
                            </thead>

                            <tbody id="alunosMatriculadosBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </form>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn-delete" id="btnExcluir">
            <i class="fa-regular fa-trash-can"></i>
            Excluir
        </button>

        <button type="button" class="btn-edit" id="btnEditar">
            <i class="fa-solid fa-pen"></i>
            Editar
        </button>

        <button type="submit" form="formAula" class="btn-save" id="btnSalvar">
            <i class="fa-solid fa-floppy-disk"></i>
            Salvar
        </button>
    </div>
</dialog>
