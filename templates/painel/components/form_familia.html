<dialog id="modalSecundario" class="medium-modal">
    <div class="modal-header">
        <div>
            <h2 id="tituloModal">Adicionar familiar</h2>
            <p id="subtituloModal">Preencha os dados abaixo</p>
        </div>

        <button type="button" class="modal-close" id="btnFechar">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <div class="modal-body">
        <form id="formFamiliar" novalidate>
            {% csrf_token %}
            <input type="hidden" id="familiar_id" name="familiar_id" value="" />

            <div class="form-grid-triplo">
                <!-- CPF -->
                <div class="form-group">
                    <label for="cpf_familiar">CPF</label>
                    <input
                        type="text"
                        id="cpf_familiar"
                        name="cpf_familiar"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        disabled
                        required
                    />
                </div>

                <!-- Nome -->
                <div class="form-group">
                    <label for="nome_familiar">Nome completo</label>
                    <input
                        type="text"
                        id="nome_familiar"
                        name="nome_familiar"
                        placeholder="Nome do familiar"
                        maxlength="150"
                        disabled
                        required
                    />
                </div>

                <!-- Telefone -->
                <div class="form-group">
                    <label for="telefone_familiar">Telefone</label>

                    <input
                        type="text"
                        id="telefone_familiar"
                        name="telefone_familiar"
                        maxlength="15"
                        placeholder="(00) 00000-0000"
                        disabled
                        required
                    />
                </div>

                <!-- Profissão -->
                <div class="form-group">
                    <label for="profissao_familiar">Profissão</label>

                    <input
                        type="text"
                        id="profissao_familiar"
                        name="profissao_familiar"
                        placeholder="Digite a profissão"
                        maxlength="100"
                        disabled
                    />
                </div>

                <!-- Local de trabalho -->
                <div class="form-group">
                    <label for="local_trabalho">
                        Local de trabalho
                    </label>

                    <input
                        type="text"
                        id="local_trabalho"
                        name="local_trabalho"
                        placeholder="Nome da empresa"
                        maxlength="150"
                        disabled
                    />
                </div>

                <!-- Escolaridade -->
                <div class="form-group">
                    <label for="escolaridade_familiar">Escolaridade</label>

                    <select
                        id="escolaridade_familiar"
                        name="escolaridade_familiar"
                        disabled
                    >
                        <option value="" selected disabled>Selecione</option>

                        {% for valor, rotulo in escolaridade %}
                        <option value="{{ valor }}">{{ rotulo }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="parentesco">Parentesco</label>
                    <input
                        type="text"
                        id="parentesco"
                        name="parentesco"
                        placeholder="Relação familiar"
                        maxlength="30"
                        disabled
                        required
                    />
                </div>
            </div>

            <!-- Parentesco -->
            <div class="vinculo-familiar">
                <input type="hidden" id="parentesco_id" name="parentesco_id" />

                <div class="checkbox-group">
                    <input
                        checked
                        type="checkbox"
                        id="familiar_vivo"
                        name="familiar_vivo"
                        disabled
                    />
                    <label for="familiar_vivo">Vivo?</label>
                </div>

                <div class="checkbox-group">
                    <input
                        type="checkbox"
                        id="familiar_responsavel"
                        name="familiar_responsavel"
                        disabled
                    />
                    <label for="familiar_responsavel">
                        Responsável legal?
                    </label>
                </div>

                <div class="checkbox-group">
                    <input
                        type="checkbox"
                        id="familiar_emergencia"
                        name="familiar_emergencia"
                        disabled
                    />
                    <label for="familiar_emergencia">
                        Contato de emergência?
                    </label>
                </div>
            </div>
        </form>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn-delete" id="btnExcluir">
            <i class="fa-regular fa-trash-can"></i>
            Excluir
        </button>

        <button type="button" class="btn-edit" id="btnEditar">
            <i class="fa-solid fa-pen"></i>
            Editar
        </button>

        <button
            type="submit"
            form="formFamiliar"
            class="btn-save"
            id="btnSalvar"
        >
            <i class="fa-solid fa-floppy-disk"></i>
            Salvar
        </button>
    </div>
</dialog>
